[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-resolution-project"
version = "0.1.0"
description = "Cross-platform social-profile identity resolution workflows"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "rapidfuzz>=3.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
train = [
  "torch>=2.0",
  "sentence-transformers>=2.2",
  "pillow>=9.0",
  "imagehash>=4.3",
]
image = [
  "requests>=2.28",
  "pillow>=9.0",
  "opencv-python>=4.8",
  "transformers>=4.30",
]
dev = ["pytest>=8.0"]
report = [
  "fpdf2>=2.8",
  "matplotlib>=3.8",
]

[project.scripts]
identity-ml = "identity_resolution.cli:main"
identity-full-candidate = "identity_resolution.workflows.full_candidate:main"
identity-crm = "identity_resolution.workflows.crm:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
